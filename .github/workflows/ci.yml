name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.22.x"
      - name: Install PC/SC headers
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race (packages with tests)
        run: go test -race ./internal/...

  go-build-matrix:
    name: Go build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cgo: "1"
            runner: ubuntu-24.04
            packages: libpcsclite-dev
          - goos: linux
            goarch: arm64
            cgo: "1"
            runner: ubuntu-24.04-arm
            packages: libpcsclite-dev
          - goos: windows
            goarch: amd64
            cgo: "0"
            runner: windows-2025
            packages: ""
          - goos: darwin
            goarch: arm64
            cgo: "1"
            runner: macos-15
            packages: ""
          - goos: darwin
            goarch: amd64
            cgo: "1"
            runner: macos-15-intel
            packages: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.22.x"
      - name: Install native deps
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -o "dist/openthaiid-${GOOS}-${GOARCH}${ext}" ./cmd/openthaiid
      - name: Smoke version
        if: matrix.goos != 'windows'
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ./dist/openthaiid-${{ matrix.goos }}-${{ matrix.goarch }} version

  sdk:
    name: Web SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
